name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run check:public
      - name: Install browser smoke dependencies
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Start API
        run: npm run dev:api > api.log 2>&1 &
      - name: Start web
        run: npm run dev:web -- --host 127.0.0.1 > web.log 2>&1 &
      - name: Browser smoke
        run: npm run test:e2e
      - name: Secret scan
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --results=verified,unknown
